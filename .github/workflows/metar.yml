name: Deploy dashboard

# Publishes the dashboard (index.html + a data/metar.json snapshot) to GitHub Pages
# whenever main changes. Live METAR no longer depends on this workflow: the page
# fetches it itself through the Cloudflare Worker (worker/metar-proxy.js, see
# docs/metar-live.md). The 30-minute schedule was removed because GitHub ran it
# only a few times a day; the snapshot is just a fallback when the worker is down.
# Requires: Settings → Pages → Source = "GitHub Actions".
# Runs started on another branch (workflow_dispatch) build and log but never deploy.

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build page
        run: python3 scripts/build.py

      - name: Fetch METAR
        env:
          BMKG_METAR_URL: ${{ vars.BMKG_METAR_URL }}
          BMKG_METAR_FIELD: ${{ vars.BMKG_METAR_FIELD }}
          BMKG_METAR_METHOD: ${{ vars.BMKG_METAR_METHOD }}
        run: |
          mkdir -p _site/data
          python3 scripts/fetch_metar.py _site/data/metar.json
          cp index.html _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: fetch
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
